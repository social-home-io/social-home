name: Publish

# Fire when a release tag is pushed OR a GitHub release is published.
# Both paths converge on the same jobs so we can cut a release from the
# UI or from ``git tag v1.2.3 && git push --tags``.
on:
  push:
    tags: ["v*.*.*"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ── Python package → PyPI via trusted publisher (OIDC) ──────────────────
  pypi:
    name: Publish socialhome to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    # Job-level permissions REPLACE the workflow-level block entirely
    # (everything not listed defaults to ``none``). ``contents: read``
    # is required for ``actions/checkout`` on private repos and is
    # safer to keep explicit on public ones too.
    permissions:
      id-token: write          # OIDC — no API token needed
      contents: read           # actions/checkout
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install build tooling
        run: pip install build
      - name: Build sdist + wheel
        run: python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # Trusted publisher — configure at pypi.org/manage/account/publishing/
        # Project: socialhome, Workflow: publish.yml, Environment: pypi

  # ── Docker core image → GHCR ────────────────────────────────────────────
  docker-core:
    name: Build & push core Docker image
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # CalVer (YYYY.M.D) image tags. ``docker/metadata-action`` runs
      # the regexes below against ``github.ref_name`` and emits one
      # tag per match, so a single ``v2026.5.10`` push gets:
      #   :2026.5.10  — pinned, immutable
      #   :2026.5     — minor track (rolling within the month)
      #   :2026       — major track (rolling within the year)
      #   :latest     — current stable
      # The ``v?`` in each pattern keeps things working whether the
      # tag is pushed as ``v2026.5.10`` or as bare ``2026.5.10``.
      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/social-home-io/socialhome
          tags: |
            type=match,pattern=v?(\d+\.\d+\.\d+),group=1
            type=match,pattern=v?(\d+\.\d+)\.\d+,group=1
            type=match,pattern=v?(\d+)\.\d+\.\d+,group=1
            type=raw,value=latest,enable=${{ github.event_name != 'workflow_dispatch' }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.sh
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

  # ── Docker GFS image → GHCR ─────────────────────────────────────────────
  # Separate job so a failure in the GFS build doesn't block the core push.
  docker-gfs:
    name: Build & push GFS Docker image
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Same CalVer fan-out as ``docker-core`` — see comments there.
      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/social-home-io/gfs
          tags: |
            type=match,pattern=v?(\d+\.\d+\.\d+),group=1
            type=match,pattern=v?(\d+\.\d+)\.\d+,group=1
            type=match,pattern=v?(\d+)\.\d+\.\d+,group=1
            type=raw,value=latest,enable=${{ github.event_name != 'workflow_dispatch' }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.gfs
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max
